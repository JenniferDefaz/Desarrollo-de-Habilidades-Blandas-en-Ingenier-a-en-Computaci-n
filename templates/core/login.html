{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Académico</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    
    <!-- Custom Dashboard CSS -->
    <link href="{% static 'css/dashboard.css' %}" rel="stylesheet">
</head>
<body class="login-page">

    <div class="login-card">
        <i class="bi bi-mortarboard-fill login-icon"></i>
        <h2 class="login-title">Sistema Académico</h2>
        <p class="login-subtitle">Habilidades Blandas</p>
        
        <form method="POST" action="{% url 'login' %}" class="login-form text-start">
            {% csrf_token %}
            
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" id="username" class="form-control" placeholder="Nombre de usuario" required autofocus>
                </div>
            </div>
            
            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" id="password" class="form-control" placeholder="Contraseña" required>
                    <button class="btn btn-outline-secondary input-group-text bg-light" type="button" id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" name="remember_me">
                <label class="form-check-label text-muted" for="rememberMe">Recordarme</label>
            </div>
            
            <button type="submit" class="btn btn-login">
                Iniciar Sesión <i class="bi bi-box-arrow-in-right ms-1"></i>
            </button>

        </form>
        
        <div class="login-footer">
            &copy; {% now "Y" %} Sistema Académico. Todos los derechos reservados.
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>

    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function (e) {
            const password = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });

        // SweetAlert for Django messages
        {% if messages %}
            {% for message in messages %}
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: '{{ message.tags|default:"info" }}' === 'error' ? 'error' : ('{{ message.tags|default:"info" }}' === 'warning' ? 'warning' : ('{{ message.tags|default:"info" }}' === 'success' ? 'success' : 'info')),
                    title: '{{ message }}',
                    showConfirmButton: false,
                    timer: 5000,
                    timerProgressBar: true
                });
            {% endfor %}
        {% endif %}

        // Recargar página si se restaura desde la caché al retroceder
        window.addEventListener('pageshow', function (event) {
            if (event.persisted || (window.performance && window.performance.getEntriesByType && window.performance.getEntriesByType('navigation')[0] && window.performance.getEntriesByType('navigation')[0].type === 'back_forward')) {
                window.location.reload();
            }
        });
    </script>
</body>
</html>
